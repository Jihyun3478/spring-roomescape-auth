<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Roomescape - 예약 관리</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="/">Roomescape Admin</a>
        <div class="navbar-nav">
            <a class="nav-link" href="/">홈</a>
            <a class="nav-link" href="/admin-theme.html">테마 관리</a>
            <a class="nav-link" href="/admin-time.html">시간 관리</a>
            <a class="nav-link active" href="/admin-reservation.html">예약 관리</a>
        </div>
    </div>
</nav>

<div class="container my-5">
    <h2>예약 관리</h2>

    <div class="card my-4 shadow-sm">
        <div class="card-body">
            <h5 class="card-title">새 예약 추가</h5>
            <form class="row g-3" id="reservation-form">
                <div class="col-md-2">
                    <label class="form-label" for="date">날짜</label>
                    <input class="form-control" id="date" required type="date">
                </div>
                <div class="col-md-2">
                    <label class="form-label" for="theme">테마</label>
                    <select class="form-select" id="theme" required>
                        <option disabled selected value="">테마 선택</option>
                    </select>
                </div>
                <div class="col-md-2">
                    <label class="form-label" for="time">시간</label>
                    <select class="form-select" disabled id="time" required>
                        <option disabled selected value="">시간 선택</option>
                    </select>
                </div>
                <div class="col-md-2">
                    <label class="form-label" for="name">예약자명</label>
                    <input class="form-control" id="name" placeholder="이름" required type="text">
                </div>
                <div class="col-md-2">
                    <label class="form-label" for="user">회원 연결 (선택)</label>
                    <select class="form-select" id="user">
                        <option selected value="">회원 없음</option>
                    </select>
                </div>
                <div class="col-md-2 d-flex align-items-end">
                    <button class="btn btn-primary w-100" type="submit">추가하기</button>
                </div>
            </form>
        </div>
    </div>

    <table class="table table-hover mt-4">
        <thead class="table-dark">
        <tr>
            <th>ID</th>
            <th>날짜</th>
            <th>시간</th>
            <th>테마</th>
            <th>예약자</th>
            <th>회원</th>
            <th>관리</th>
        </tr>
        </thead>
        <tbody id="reservation-table-body"></tbody>
    </table>
</div>

<script>
    const token = sessionStorage.getItem('token');

    if (!token) {
        window.location.href = '/login.html?redirect=/admin-reservation.html';
    }

    function escapeHtml(str) {
        if (str == null) return '';
        return String(str)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#39;');
    }

    document.addEventListener('DOMContentLoaded', () => {
        fetchReservations();
        fetchThemes();
        fetchUsers();
    });

    document.getElementById('date').addEventListener('change', fetchAvailableTimes);
    document.getElementById('theme').addEventListener('change', fetchAvailableTimes);
    document.getElementById('reservation-form').addEventListener('submit', addReservation);

    function fetchReservations() {
        fetch('/admin/reservations', {
            headers: { 'Authorization': 'Bearer ' + token }
        })
        .then(response => {
            if (response.status === 403) {
                alert('관리자만 접근 가능합니다.');
                window.location.href = '/';
                return;
            }
            return response.json();
        })
        .then(reservations => {
            if (!reservations) return;
            const tbody = document.getElementById('reservation-table-body');
            tbody.innerHTML = reservations.map(res => `
                <tr>
                    <td>${escapeHtml(res.id)}</td>
                    <td>${escapeHtml(res.date)}</td>
                    <td>${escapeHtml(res.time.startAt)}</td>
                    <td>${escapeHtml(res.theme.name)}</td>
                    <td>${escapeHtml(res.name)}</td>
                    <td>${res.user ? escapeHtml(res.user.name) : '-'}</td>
                    <td>
                        <button class="btn btn-danger btn-sm" onclick="deleteReservation(${res.id})">삭제</button>
                    </td>
                </tr>
            `).join('');
        });
    }

    function fetchThemes() {
        fetch('/themes')
            .then(response => response.json())
            .then(themes => {
                const select = document.getElementById('theme');
                themes.forEach(theme => {
                    const option = document.createElement('option');
                    option.value = theme.id;
                    option.textContent = theme.name;
                    select.appendChild(option);
                });
            });
    }

    function fetchUsers() {
        fetch('/admin/users', {
            headers: { 'Authorization': 'Bearer ' + token }
        })
        .then(response => response.json())
        .then(users => {
            const select = document.getElementById('user');
            users.forEach(user => {
                const option = document.createElement('option');
                option.value = user.id;
                option.textContent = `${user.name} (${user.email})`;
                select.appendChild(option);
            });
        });
    }

    function fetchAvailableTimes() {
        const date = document.getElementById('date').value;
        const themeId = document.getElementById('theme').value;
        const timeSelect = document.getElementById('time');

        if (date && themeId) {
            fetch(`/times?themeId=${themeId}&date=${date}`)
                .then(response => response.json())
                .then(times => {
                    timeSelect.innerHTML = '<option value="" disabled selected>시간 선택</option>';
                    times.forEach(time => {
                        const option = document.createElement('option');
                        option.value = time.id;
                        option.textContent = time.startAt;
                        if (!time.isNotReserved) {
                            option.disabled = true;
                            option.textContent += ' (예약됨)';
                        }
                        timeSelect.appendChild(option);
                    });
                    timeSelect.disabled = false;
                });
        } else {
            timeSelect.disabled = true;
            timeSelect.innerHTML = '<option value="" disabled selected>시간 선택</option>';
        }
    }

    function addReservation(event) {
        event.preventDefault();
        const userId = document.getElementById('user').value;
        const payload = {
            date: document.getElementById('date').value,
            themeId: document.getElementById('theme').value,
            timeId: document.getElementById('time').value,
            name: document.getElementById('name').value,
        };

        if (userId) {
            payload.userId = parseInt(userId);
        }

        fetch('/admin/reservations', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'Authorization': 'Bearer ' + token
            },
            body: JSON.stringify(payload)
        })
        .then(response => {
            if (response.status === 403) {
                alert('관리자만 접근 가능합니다.');
                window.location.href = '/';
                return;
            }
            if (response.ok) {
                alert('예약이 추가되었습니다.');
                fetchReservations();
                document.getElementById('reservation-form').reset();
                document.getElementById('time').disabled = true;
            } else {
                alert('예약 추가 실패');
            }
        });
    }

    function deleteReservation(id) {
        if (!confirm('정말 취소하시겠습니까?')) return;
        fetch(`/admin/reservations/${id}`, {
            method: 'DELETE',
            headers: { 'Authorization': 'Bearer ' + token }
        })
        .then(response => {
            if (response.status === 403) {
                alert('관리자만 접근 가능합니다.');
                window.location.href = '/';
                return;
            }
            if (response.ok) {
                alert('예약이 취소되었습니다.');
                fetchReservations();
            } else {
                alert('예약 취소 실패');
            }
        });
    }
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Roomescape - 로그인</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; }
    </style>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="/">Roomescape</a>
    </div>
</nav>

<div class="container" style="max-width: 400px; margin-top: 5rem;">
    <div class="card shadow">
        <div class="card-body p-4">
            <h4 class="card-title mb-4 text-center">로그인</h4>
            <div class="mb-3">
                <label class="form-label">이메일</label>
                <input class="form-control" id="email" placeholder="이메일을 입력하세요" type="email">
            </div>
            <div class="mb-3">
                <label class="form-label">비밀번호</label>
                <input class="form-control" id="password" placeholder="비밀번호를 입력하세요" type="password"
                       onkeyup="if(event.key === 'Enter') login()">
            </div>
            <div id="error-message" class="text-danger small mb-3 d-none"></div>
            <button class="btn btn-primary w-100" onclick="login()">로그인</button>
        </div>
    </div>
</div>

<script>
    function login() {
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;
        const errorEl = document.getElementById('error-message');

        fetch('/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email, password })
        })
        .then(response => {
            if (!response.ok) throw new Error('이메일 또는 비밀번호가 올바르지 않습니다.');
            const token = response.headers.get('Authorization').replace('Bearer ', '');
            sessionStorage.setItem('token', token);
            const redirect = new URLSearchParams(window.location.search).get('redirect') || '/';
            window.location.href = redirect;
        })
        .catch(error => {
            errorEl.textContent = error.message;
            errorEl.classList.remove('d-none');
        });
    }
</script>
</body>
</html>

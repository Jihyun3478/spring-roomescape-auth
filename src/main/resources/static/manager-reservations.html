<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Roomescape - 매니저 예약 관리</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; }
    </style>
</head>
<body>
<div class="modal fade" id="updateModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">예약 날짜·시간 변경</h5>
                <button class="btn-close" data-bs-dismiss="modal" type="button"></button>
            </div>
            <div class="modal-body">
                <div class="mb-3">
                    <label class="form-label">날짜</label>
                    <input class="form-control" id="update-date" type="date">
                </div>
                <div class="mb-3">
                    <label class="form-label">시간</label>
                    <select class="form-select" id="update-time">
                        <option disabled selected value="">날짜를 먼저 선택하세요</option>
                    </select>
                </div>
                <div id="update-error" class="text-danger small d-none"></div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" data-bs-dismiss="modal" type="button">취소</button>
                <button class="btn btn-primary" id="confirm-update">변경하기</button>
            </div>
        </div>
    </div>
</div>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="/">Roomescape</a>
        <div class="navbar-nav">
            <a class="nav-link" href="/">홈</a>
            <a class="nav-link active" href="/manager-reservations.html">예약 관리</a>
            <a class="nav-link" id="logout-btn" href="#" onclick="logout()">로그아웃</a>
        </div>
    </div>
</nav>

<div class="container my-5" style="max-width: 900px;">
    <h2 class="mb-4">매장 예약 관리</h2>
    <div id="empty-message" class="d-none text-muted">예약 내역이 없습니다.</div>
    <table class="table table-hover" id="reservation-table">
        <thead class="table-dark">
        <tr>
            <th>ID</th>
            <th>예약자</th>
            <th>테마</th>
            <th>날짜</th>
            <th>시간</th>
            <th>변경</th>
            <th>삭제</th>
        </tr>
        </thead>
        <tbody id="reservation-tbody"></tbody>
    </table>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    const token = sessionStorage.getItem('token');

    if (!token) {
        window.location.href = '/login.html?redirect=/manager-reservations.html';
    }

    function escapeHtml(str) {
        if (str == null) return '';
        return String(str)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#39;');
    }

    function getRole() {
        if (!token) return null;
        const decoded = atob(token);
        return decoded.split('&')[1].split('=')[1];
    }

    if (getRole() !== 'MANAGER') {
        alert('매니저만 접근 가능합니다.');
        window.location.href = '/';
    }

    let currentReservationId = null;
    let currentThemeId = null;
    let updateModal = null;

    document.addEventListener('DOMContentLoaded', () => {
        updateModal = new bootstrap.Modal(document.getElementById('updateModal'));
        document.getElementById('update-date').addEventListener('change', fetchAvailableTimes);
        document.getElementById('confirm-update').addEventListener('click', confirmUpdate);
        fetchReservations();
    });

    function fetchReservations() {
        fetch('/manager/reservations', {
            headers: { 'Authorization': 'Bearer ' + token }
        })
        .then(response => {
            if (response.status === 401) {
                window.location.href = '/login.html';
                return;
            }
            if (response.status === 403) {
                alert('매니저만 접근 가능합니다.');
                window.location.href = '/';
                return;
            }
            return response.json();
        })
        .then(reservations => {
            if (!reservations) return;
            const tbody = document.getElementById('reservation-tbody');
            const emptyMsg = document.getElementById('empty-message');
            const table = document.getElementById('reservation-table');

            if (reservations.length === 0) {
                emptyMsg.classList.remove('d-none');
                table.classList.add('d-none');
                return;
            }

            emptyMsg.classList.add('d-none');
            table.classList.remove('d-none');

            tbody.innerHTML = reservations.map(res => `
                <tr>
                    <td>${escapeHtml(res.id)}</td>
                    <td>${escapeHtml(res.name)}</td>
                    <td>${escapeHtml(res.theme.name)}</td>
                    <td>${escapeHtml(res.date)}</td>
                    <td>${escapeHtml(res.time.startAt)}</td>
                    <td>
                        <button class="btn btn-outline-primary btn-sm"
                            onclick="openUpdateModal(${res.id}, ${res.theme.id})">변경</button>
                    </td>
                    <td>
                        <button class="btn btn-outline-danger btn-sm"
                            onclick="deleteReservation(${res.id})">삭제</button>
                    </td>
                </tr>
            `).join('');
        })
        .catch(error => console.error(error));
    }

    function deleteReservation(id) {
        if (!confirm('정말 삭제하시겠습니까?')) return;

        fetch(`/manager/reservations/${id}`, {
            method: 'DELETE',
            headers: { 'Authorization': 'Bearer ' + token }
        })
        .then(response => {
            if (response.ok) {
                alert('예약이 삭제되었습니다.');
                fetchReservations();
            } else {
                return response.json().then(err => { throw new Error(err.detail || '삭제 실패'); });
            }
        })
        .catch(error => alert(error.message));
    }

    function openUpdateModal(reservationId, themeId) {
        currentReservationId = reservationId;
        currentThemeId = themeId;
        document.getElementById('update-date').value = '';
        document.getElementById('update-time').innerHTML = '<option disabled selected value="">날짜를 먼저 선택하세요</option>';
        document.getElementById('update-error').classList.add('d-none');
        const today = new Date().toISOString().split('T')[0];
        document.getElementById('update-date').min = today;
        updateModal.show();
    }

    function fetchAvailableTimes() {
        const date = document.getElementById('update-date').value;
        if (!date || !currentThemeId) return;

        fetch(`/times?themeId=${currentThemeId}&date=${date}`)
            .then(response => response.json())
            .then(times => {
                const select = document.getElementById('update-time');
                const available = times.filter(t => t.isNotReserved);

                if (available.length === 0) {
                    select.innerHTML = '<option disabled selected value="">예약 가능한 시간이 없습니다</option>';
                    return;
                }

                select.innerHTML = '<option disabled selected value="">시간 선택</option>' +
                    available.map(t => `<option value="${escapeHtml(t.id)}">${escapeHtml(t.startAt)}</option>`).join('');
            });
    }

    function confirmUpdate() {
        const date = document.getElementById('update-date').value;
        const timeId = document.getElementById('update-time').value;
        const errorEl = document.getElementById('update-error');

        if (!date || !timeId) {
            errorEl.textContent = '날짜와 시간을 모두 선택해주세요.';
            errorEl.classList.remove('d-none');
            return;
        }

        fetch(`/manager/reservations/${currentReservationId}`, {
            method: 'PATCH',
            headers: {
                'Content-Type': 'application/json',
                'Authorization': 'Bearer ' + token
            },
            body: JSON.stringify({ date, timeId: parseInt(timeId) })
        })
        .then(response => {
            if (response.ok) {
                updateModal.hide();
                alert('예약이 변경되었습니다.');
                fetchReservations();
            } else {
                return response.json().then(err => { throw new Error(err.detail || '변경 실패'); });
            }
        })
        .catch(error => {
            errorEl.textContent = error.message;
            errorEl.classList.remove('d-none');
        });
    }

    function logout() {
        fetch('/logout', {
            method: 'POST',
            headers: { 'Authorization': 'Bearer ' + token }
        }).finally(() => {
            sessionStorage.removeItem('token');
            window.location.href = '/';
        });
    }
</script>
</body>
</html>

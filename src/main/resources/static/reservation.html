<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Roomescape - 예약하기</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; }
        .reservation-container { max-width: 800px; margin: 3rem auto; padding: 2rem; background: white; border-radius: 10px; box-shadow: 0 0.5rem 1rem rgba(0,0,0,0.15); }
        .theme-selected { border: 2px solid #0d6efd !important; }
        .shop-selected { border: 2px solid #0d6efd !important; background-color: #e7f0ff; }
        .time-slot { cursor: pointer; transition: all 0.2s; }
        .time-slot:not(.disabled):hover { background-color: #e9ecef; }
        .time-slot.selected { background-color: #0d6efd; color: white; border-color: #0d6efd; }
    </style>
</head>
<body>
<div class="modal fade" id="successModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header bg-success text-white">
                <h5 class="modal-title">예약이 등록되었습니다.</h5>
                <button class="btn-close btn-close-white" data-bs-dismiss="modal" type="button"></button>
            </div>
            <div class="modal-body">
                <table class="table table-bordered mb-0">
                    <tbody>
                    <tr>
                        <th class="table-secondary" style="width: 40%">예약 ID</th>
                        <td id="modal-reservation-id"></td>
                    </tr>
                    <tr>
                        <th class="table-secondary">예약자</th>
                        <td id="modal-reservation-name"></td>
                    </tr>
                    <tr>
                        <th class="table-secondary">날짜</th>
                        <td id="modal-reservation-date"></td>
                    </tr>
                    <tr>
                        <th class="table-secondary">시간</th>
                        <td id="modal-reservation-time"></td>
                    </tr>
                    <tr>
                        <th class="table-secondary">테마</th>
                        <td id="modal-reservation-theme"></td>
                    </tr>
                    </tbody>
                </table>
            </div>
            <div class="modal-footer">
                <button class="btn btn-primary" onclick="location.href='/'" type="button">홈으로</button>
                <button class="btn btn-secondary" data-bs-dismiss="modal" type="button">닫기</button>
            </div>
        </div>
    </div>
</div>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="/">Roomescape</a>
        <div class="navbar-nav">
            <a class="nav-link" href="/">홈</a>
            <a class="nav-link active" href="/reservation.html">예약하기</a>
            <a class="nav-link" href="/my-reservations.html">내 예약</a>
            <div class="nav-item dropdown" id="admin-menu" style="display:none;">
                <a class="nav-link dropdown-toggle" data-bs-toggle="dropdown" href="#" role="button">관리자</a>
                <ul class="dropdown-menu">
                    <li><a class="dropdown-item" href="/admin-theme.html">테마 관리</a></li>
                    <li><a class="dropdown-item" href="/admin-time.html">시간 관리</a></li>
                    <li><a class="dropdown-item" href="/admin-reservation.html">예약 관리</a></li>
                </ul>
            </div>
        </div>
    </div>
</nav>

<div class="container">
    <div class="reservation-container">
        <h2 class="text-center mb-4">방탈출 예약</h2>

        <div class="mb-4">
            <h5>1. 매장 선택</h5>
            <div class="row g-3 mt-1" id="shop-list"></div>
        </div>

        <div class="mb-4">
            <h5>2. 테마 선택</h5>
            <div class="row g-3 mt-1" id="theme-list">
                <p class="text-muted">매장을 먼저 선택해주세요.</p>
            </div>
        </div>

        <div class="mb-4">
            <h5>3. 날짜 선택</h5>
            <input class="form-control" id="reservation-date" min="" type="date">
        </div>

        <div class="mb-4">
            <h5>4. 시간 선택</h5>
            <div class="row g-2 mt-1" id="time-list">
                <p class="text-muted">테마와 날짜를 먼저 선택해주세요.</p>
            </div>
        </div>

        <button class="btn btn-primary w-100 btn-lg" disabled id="submit-reservation">예약 완료</button>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    const token = sessionStorage.getItem('token');

    if (!token) {
        window.location.href = '/login.html?redirect=/reservation.html';
    }

    function escapeHtml(str) {
        if (str == null) return '';
        return String(str)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#39;');
    }

    function getRole() {
        if (!token) return null;
        const decoded = atob(token);
        return decoded.split('&')[1].split('=')[1];
    }

    if (getRole() === 'ADMIN') {
        document.getElementById('admin-menu').style.display = 'block';
    }

    let selectedShopId = null;
    let selectedThemeId = null;
    let selectedTimeId = null;

    document.addEventListener('DOMContentLoaded', () => {
        const dateInput = document.getElementById('reservation-date');
        const today = new Date().toISOString().split('T')[0];
        dateInput.min = today;
        dateInput.value = today;

        fetchShops();
        dateInput.addEventListener('change', fetchTimes);
        document.getElementById('submit-reservation').addEventListener('click', submitReservation);
    });

    function fetchShops() {
        fetch('/shops')
            .then(response => response.json())
            .then(shops => {
                const shopList = document.getElementById('shop-list');
                shopList.innerHTML = shops.map(shop => `
                    <div class="col-md-4">
                        <div class="card h-100 shop-item p-3 text-center" data-id="${escapeHtml(shop.id)}" style="cursor: pointer;">
                            <h6 class="mb-0">${escapeHtml(shop.name)}</h6>
                        </div>
                    </div>
                `).join('');

                document.querySelectorAll('.shop-item').forEach(item => {
                    item.addEventListener('click', function () {
                        document.querySelectorAll('.shop-item').forEach(i => i.classList.remove('shop-selected'));
                        this.classList.add('shop-selected');
                        selectedShopId = this.dataset.id;
                        selectedThemeId = null;
                        selectedTimeId = null;
                        fetchThemes(selectedShopId);
                        checkValidation();
                    });
                });
            });
    }

    function fetchThemes(shopId) {
        fetch('/themes')
            .then(response => response.json())
            .then(themes => {
                const filtered = themes.filter(t => t.shop && String(t.shop.id) === String(shopId));
                const themeList = document.getElementById('theme-list');

                if (filtered.length === 0) {
                    themeList.innerHTML = '<p class="text-muted">해당 매장에 테마가 없습니다.</p>';
                    return;
                }

                themeList.innerHTML = filtered.map(theme => `
                    <div class="col-md-4">
                        <div class="card h-100 theme-item" data-id="${escapeHtml(theme.id)}" style="cursor: pointer;">
                            <img src="${escapeHtml(theme.thumbnail)}" class="card-img-top" alt="${escapeHtml(theme.name)}" height="100"
                                 style="object-fit: cover;"
                                 onerror="this.src='https://via.placeholder.com/150?text=No+Image'">
                            <div class="card-body p-2 text-center">
                                <h6 class="card-title mb-0">${escapeHtml(theme.name)}</h6>
                            </div>
                        </div>
                    </div>
                `).join('');

                document.querySelectorAll('.theme-item').forEach(item => {
                    item.addEventListener('click', function () {
                        document.querySelectorAll('.theme-item').forEach(i => i.classList.remove('theme-selected'));
                        this.classList.add('theme-selected');
                        selectedThemeId = this.dataset.id;
                        fetchTimes();
                    });
                });
            });
    }

    function fetchTimes() {
        const date = document.getElementById('reservation-date').value;
        if (!selectedThemeId || !date) return;

        fetch(`/times?themeId=${selectedThemeId}&date=${date}`)
            .then(response => response.json())
            .then(times => {
                const timeList = document.getElementById('time-list');
                if (times.length === 0) {
                    timeList.innerHTML = '<p class="text-danger">해당 날짜에 가능한 시간이 없습니다.</p>';
                    return;
                }
                timeList.innerHTML = times.map(time => `
                    <div class="col-4">
                        <div class="border rounded p-2 text-center time-slot ${time.isNotReserved ? '' : 'disabled bg-light text-muted'}"
                             data-id="${escapeHtml(time.id)}"
                             ${!time.isNotReserved ? 'style="pointer-events: none;"' : ''}>
                            ${escapeHtml(time.startAt)}
                        </div>
                    </div>
                `).join('');

                document.querySelectorAll('.time-slot:not(.disabled)').forEach(slot => {
                    slot.addEventListener('click', function () {
                        document.querySelectorAll('.time-slot').forEach(s => s.classList.remove('selected'));
                        this.classList.add('selected');
                        selectedTimeId = this.dataset.id;
                        checkValidation();
                    });
                });
            });
    }

    function checkValidation() {
        document.getElementById('submit-reservation').disabled = !(selectedShopId && selectedThemeId && selectedTimeId);
    }

    function submitReservation() {
        const date = document.getElementById('reservation-date').value;

        fetch('/reservations', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'Authorization': 'Bearer ' + token
            },
            body: JSON.stringify({
                date: date,
                timeId: parseInt(selectedTimeId),
                themeId: parseInt(selectedThemeId)
            })
        })
        .then(response => {
            if (response.ok) return response.json();
            return response.json().then(err => { throw new Error(err.detail || '예약 실패'); });
        })
        .then(data => {
            document.getElementById('modal-reservation-id').textContent = data.id;
            document.getElementById('modal-reservation-name').textContent = data.name;
            document.getElementById('modal-reservation-date').textContent = data.date;
            document.getElementById('modal-reservation-time').textContent = data.time.startAt;
            document.getElementById('modal-reservation-theme').textContent = data.theme.name;
            new bootstrap.Modal(document.getElementById('successModal')).show();
        })
        .catch(error => alert(error.message));
    }
</script>
</body>
</html>
